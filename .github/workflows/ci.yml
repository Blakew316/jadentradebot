name: CI

on:
  push:
    branches:
      - main
      - claude/trading-stock-atr-identifier-c2wzlm
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Build static site (offline smoke test)
        run: python -m jadentradebot sitegen --out _site --source offline
