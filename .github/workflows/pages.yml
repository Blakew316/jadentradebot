# Scans the watchlist with live market data and publishes the dashboard as a
# static snapshot on GitHub Pages.
#
# One-time setup: repo Settings -> Pages -> "Build and deployment" ->
# Source: "GitHub Actions". After that this workflow deploys on every push,
# on the market-hours schedule below, and on manual dispatch.

name: Deploy dashboard to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/trading-stock-atr-identifier-c2wzlm
  schedule:
    # Every 30 min during US market hours (13:30-20:00 UTC), Mon-Fri,
    # plus one end-of-day snapshot. GitHub cron runs best-effort.
    - cron: "*/30 13-20 * * 1-5"
    - cron: "15 21 * * 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers (empty = default watchlist)"
        required: false
        default: ""
      source:
        description: "Data source (auto / yfinance / stooq / offline)"
        required: false
        default: "auto"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan and build static dashboard
        env:
          TICKERS: ${{ inputs.tickers }}
          SOURCE: ${{ inputs.source }}
        run: |
          args=(--out _site --source "${SOURCE:-auto}")
          if [ -n "$TICKERS" ]; then
            IFS=',' read -ra syms <<< "$TICKERS"
            for s in "${syms[@]}"; do
              s="$(echo "$s" | xargs)"
              [ -n "$s" ] && args+=(-t "$s")
            done
          fi
          python -m jadentradebot sitegen "${args[@]}"
      - name: Add CNAME for custom domain
        run: cp CNAME _site/CNAME
      - name: Add .nojekyll
        run: touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
