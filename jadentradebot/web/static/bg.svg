<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1a3a"/>
      <stop offset=".5" stop-color="#123a6e"/>
      <stop offset="1" stop-color="#0a1c40"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="55%" cy="40%" r="70%">
      <stop offset="0" stop-color="#2f6fc4" stop-opacity=".30"/>
      <stop offset="1" stop-color="#2f6fc4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7db8ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7db8ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <rect width="1600" height="900" fill="url(#centerGlow)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity=".045" stroke-width="1">
    <path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600"/>
    <path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/>
  </g>

  <!-- rising market line -->
  <path d="M0 780 L170 700 L340 745 L510 620 L680 660 L850 520 L1020 565 L1190 420 L1360 460 L1600 290 L1600 900 L0 900 Z"
        fill="url(#area)"/>
  <path d="M0 780 L170 700 L340 745 L510 620 L680 660 L850 520 L1020 565 L1190 420 L1360 460 L1600 290"
        fill="none" stroke="#8ec4ff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
</svg>
